<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cakes Studio - Custom Cakes & Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --gold:#D4AF37; --gold-light:#f0d84a; --dark-bg:#1a1410; --cream:#F5EFE7;
    --accent:#8B6F47; --text-dark:#2a2420; --pink:#e8a5c4;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --cream:#F5EFE7; }
  }
  html,body{height:100%;}
  body{
    font-family:'Poppins',sans-serif; background:var(--cream); color:var(--text-dark);
    line-height:1.6; overflow-x:hidden;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }

  /* ---------- custom cursor (mouse devices only) ---------- */
  body.has-cursor, body.has-cursor a, body.has-cursor button, body.has-cursor .cake-card{cursor:none;}
  #cursorDot, #cursorRing{
    position:fixed; left:0; top:0; pointer-events:none; z-index:9999;
    transform:translate(-50%,-50%); will-change:transform;
  }
  #cursorDot{
    width:9px;height:9px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 10px 2px rgba(212,175,55,0.7);
    transition:width .18s ease, height .18s ease, background .18s ease;
  }
  #cursorRing{
    width:34px;height:34px;border-radius:50%;border:1.5px solid rgba(212,175,55,0.55);
    transition:width .25s cubic-bezier(.2,.8,.2,1), height .25s cubic-bezier(.2,.8,.2,1), border-color .25s ease, opacity .25s ease;
  }
  body.has-cursor .cursor-hover #cursorRing{width:52px;height:52px;border-color:var(--pink);}
  body.has-cursor .cursor-hover #cursorDot{width:6px;height:6px;background:var(--pink);}
  .sparkle-trail{
    position:fixed; top:0; left:0; pointer-events:none; z-index:9998;
    font-size:13px; opacity:0.95; will-change:transform,opacity;
    animation:sparkleFade .9s ease-out forwards;
  }
  @keyframes sparkleFade{
    0%{transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1;}
    100%{transform:translate(-50%,-50%) scale(0.2) translateY(18px) rotate(90deg); opacity:0;}
  }

  /* ---------- click burst (cake shower / glitter) ---------- */
  .burst-piece{
    position:fixed; top:0; left:0; pointer-events:none; z-index:9999;
    will-change:transform,opacity; font-size:var(--pz,20px);
  }
  .burst-piece.is-emoji{ animation:burstFly var(--dur,900ms) cubic-bezier(.17,.67,.3,.99) forwards; }
  .burst-piece.is-glit{
    width:var(--pz,8px); height:var(--pz,8px); border-radius:2px; background:var(--gc,#D4AF37);
    animation:burstFly var(--dur,900ms) cubic-bezier(.17,.67,.3,.99) forwards;
  }
  @keyframes burstFly{
    0%{ transform:translate(-50%,-50%) translate(0,0) rotate(0deg) scale(1); opacity:1; }
    70%{ opacity:1; }
    100%{
      transform:translate(-50%,-50%) translate(var(--tx,0px),var(--ty,120px)) rotate(var(--rot,180deg)) scale(0.6);
      opacity:0;
    }
  }

  /* ---------- header ---------- */
  header{background:var(--dark-bg);color:var(--cream);padding:16px 0;position:sticky;top:0;z-index:100;box-shadow:0 4px 12px rgba(0,0,0,.3);}
  .header-container{max-width:1200px;margin:0 auto;padding:0 20px;display:flex;justify-content:space-between;align-items:center;gap:16px;}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 2px var(--gold);}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-text .name{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--gold);}
  .brand-text .sub{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);}
  .header-actions{display:flex;gap:16px;align-items:center;}
  .cta-btn{background:var(--gold);color:var(--text-dark);border:none;padding:11px 20px;border-radius:50px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .3s ease;display:flex;align-items:center;gap:8px;font-size:13px;white-space:nowrap;}
  .cta-btn:hover{background:var(--gold-light);transform:translateY(-2px);box-shadow:0 6px 16px rgba(212,175,55,.3);}
  .instagram-link{color:var(--gold);font-size:18px;text-decoration:none;transition:all .3s ease;}
  .instagram-link:hover{color:var(--cream);transform:scale(1.15);}

  /* ---------- hero ---------- */
  .hero{background:linear-gradient(135deg,var(--dark-bg) 0%,#2a2420 100%);color:var(--cream);padding:70px 20px;text-align:center;position:relative;overflow:hidden;}
  .hero::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(212,175,55,.12) 0%,transparent 50%);pointer-events:none;}
  .hero-content{max-width:700px;margin:0 auto;position:relative;z-index:1;}
  .hero-logo{width:84px;height:84px;border-radius:50%;object-fit:cover;box-shadow:0 0 0 3px var(--gold),0 10px 30px rgba(0,0,0,.4);margin-bottom:20px;}
  .hero h1{font-family:'Playfair Display',serif;font-size:46px;margin-bottom:14px;color:var(--gold);text-shadow:2px 2px 4px rgba(0,0,0,.3);}
  .hero p{font-size:15px;opacity:.95;margin-bottom:30px;}
  .hero-cta{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn-primary,.btn-secondary{padding:14px 30px;border:none;border-radius:50px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;transition:all .3s ease;display:inline-flex;align-items:center;gap:8px;}
  .btn-primary{background:var(--gold);color:var(--text-dark);}
  .btn-primary:hover{background:var(--gold-light);transform:translateY(-3px);box-shadow:0 8px 20px rgba(212,175,55,.4);}
  .btn-secondary{background:transparent;color:var(--gold);border:2px solid var(--gold);}
  .btn-secondary:hover{background:var(--gold);color:var(--text-dark);transform:translateY(-3px);}

  /* ---------- gallery ---------- */
  .gallery-section{max-width:1200px;margin:70px auto;padding:0 20px;}
  .section-title{text-align:center;font-family:'Playfair Display',serif;font-size:40px;margin-bottom:14px;position:relative;padding-bottom:18px;}
  .section-title::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:60px;height:3px;background:var(--gold);}
  .section-subtitle{text-align:center;color:var(--accent);margin-bottom:44px;font-size:14px;letter-spacing:1px;}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px;}
  .cake-card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.1);transition:transform .35s ease,box-shadow .35s ease;position:relative;}
  .cake-card:hover{transform:translateY(-8px);box-shadow:0 16px 36px rgba(212,175,55,.25);}
  .cake-image-wrap{position:relative;aspect-ratio:1/1;overflow:hidden;background:linear-gradient(135deg,#f5efe7,#e8dcc7);}
  .cake-image-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1);}
  .cake-card:hover .cake-image-wrap img{transform:scale(1.08);}
  .cake-info{padding:18px;}
  .cake-type{color:var(--gold);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;font-weight:700;}
  .cake-name{font-family:'Playfair Display',serif;font-size:17px;margin-bottom:8px;}
  .cake-desc{color:#666;font-size:12.5px;margin-bottom:14px;}
  .cake-card-cta{display:block;text-align:center;text-decoration:none;box-sizing:border-box;background:var(--gold);color:var(--text-dark);border:none;padding:10px 18px;border-radius:25px;font-weight:600;cursor:pointer;font-size:12.5px;width:100%;transition:all .3s ease;}
  .cake-card-cta:hover{background:var(--gold-light);}

  /* ---------- contact ---------- */
  .contact-section{background:var(--dark-bg);color:var(--cream);padding:60px 20px;text-align:center;}
  .contact-container{max-width:700px;margin:0 auto;}
  .contact-section h2{font-family:'Playfair Display',serif;font-size:38px;margin-bottom:18px;color:var(--gold);}
  .contact-section p{font-size:15px;margin-bottom:30px;opacity:.9;}
  .contact-methods{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:30px;}
  .contact-badge{background:rgba(212,175,55,.1);border:2px solid var(--gold);color:var(--gold);padding:11px 22px;border-radius:50px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .divider{width:60px;height:2px;background:var(--gold);margin:30px auto;opacity:.5;}

  /* ---------- footer ---------- */
  footer{background:#0f0d0a;color:var(--cream);padding:40px 20px;text-align:center;border-top:2px solid var(--gold);}
  .footer-content{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;margin-bottom:28px;text-align:left;}
  .footer-section h3{color:var(--gold);margin-bottom:14px;font-size:15px;}
  .footer-section p{font-size:13.5px;opacity:.8;line-height:1.8;}
  .social-links{display:flex;gap:14px;margin-top:14px;}
  .social-links a{display:inline-flex;width:38px;height:38px;align-items:center;justify-content:center;background:var(--gold);color:var(--text-dark);border-radius:50%;text-decoration:none;font-size:17px;transition:all .3s ease;}
  .social-links a:hover{background:var(--cream);transform:translateY(-4px);}
  .footer-bottom{border-top:1px solid rgba(212,175,55,.2);padding-top:22px;font-size:12.5px;opacity:.7;}

  @media (max-width:768px){
    .hero h1{font-size:32px;}
    .section-title{font-size:30px;}
    .brand-text .name{font-size:18px;}
    .cta-btn{padding:9px 16px;font-size:12px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }

  /* ---------- dark aurora theme (Superconscious-inspired) ---------- */
  :root{--ink:#07050f;--violet:#7c3aed;--indigo:#3b2bd9;--lav:#b9a7ff;}
  body{background:var(--ink);color:var(--cream);}
  body::before{content:'';position:fixed;inset:-30%;z-index:-1;pointer-events:none;
    background:
      radial-gradient(40% 35% at 20% 25%,rgba(124,58,237,.55),transparent 70%),
      radial-gradient(38% 38% at 80% 20%,rgba(59,43,217,.55),transparent 70%),
      radial-gradient(45% 40% at 60% 85%,rgba(217,70,239,.30),transparent 70%);
    animation:auroraDrift 20s ease-in-out infinite alternate;}
  @keyframes auroraDrift{
    0%{transform:translate3d(-4%,-3%,0) scale(1);}
    50%{transform:translate3d(5%,4%,0) scale(1.12);}
    100%{transform:translate3d(-2%,6%,0) scale(1.05);}}
  header{background:rgba(10,7,22,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.08);}
  .hero{background:transparent;padding:90px 20px 80px;}
  .hero::before{display:none;}
  .hero h1{font-size:54px;color:#fff;text-shadow:none;letter-spacing:-.5px;}
  .hero p{color:#d9d2f5;}
  .hero-content{z-index:2;}
  .cake-spin{position:relative;width:min(380px,86vw);margin:34px auto 0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;}
  .cake-spin:active{cursor:grabbing;}
  .cake-spin::before{content:'';position:absolute;left:50%;top:55%;width:130%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;
    background:radial-gradient(circle,rgba(124,58,237,.55),rgba(59,43,217,.25) 45%,transparent 70%);z-index:-1;pointer-events:none;}
  .cake-spin img{display:block;width:100%;height:auto;pointer-events:none;-webkit-user-drag:none;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));}
  .cake-hint{margin-top:8px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--lav);opacity:.85;}
  .section-title{color:#fff;}
  .section-subtitle{color:var(--lav);}
  .cake-card{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .cake-card:hover{box-shadow:0 16px 44px rgba(124,58,237,.45);border-color:rgba(185,167,255,.5);}
  .cake-name{color:#fff;}
  .cake-desc{color:#c9c2e6;}
  .cake-image-wrap{background:#120d24;}
  .contact-section{background:transparent;}
  footer{background:rgba(10,7,22,.7);}
  @media (max-width:600px){.hero h1{font-size:36px;}}
  @media (prefers-reduced-motion:reduce){body::before{animation:none}}

  /* ---------- menu bar, location, dock ---------- */
  html{scroll-behavior:smooth;}
  #home,#cakes,#location,#contact{scroll-margin-top:84px;}
  .main-nav{display:flex;gap:6px;margin-left:auto;margin-right:14px;}
  .main-nav a{color:var(--cream);text-decoration:none;font-size:13.5px;font-weight:500;padding:8px 14px;border-radius:50px;transition:all .25s ease;}
  .main-nav a:hover{background:rgba(185,167,255,.16);color:var(--gold);}
  .menu-toggle{display:none;background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--cream);width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;}
  .location-section{max-width:640px;margin:70px auto 0;padding:0 20px;}
  .location-card{text-align:center;padding:36px 24px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 8px 30px rgba(0,0,0,.35);}
  .location-icon{width:54px;height:54px;margin:0 auto 14px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--text-dark);background:var(--gold);}
  .location-card h2{font-family:'Playfair Display',serif;font-size:30px;color:#fff;margin-bottom:10px;}
  .location-address{color:#d9d2f5;font-size:14.5px;margin-bottom:22px;}
  a.contact-badge{text-decoration:none;transition:all .25s ease;}
  a.contact-badge:hover{background:var(--gold);color:var(--text-dark);transform:translateY(-2px);}
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;gap:14px;padding:8px 12px;border-radius:50px;background:rgba(10,7,22,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);box-shadow:0 10px 30px rgba(0,0,0,.5);}
  .dock-btn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:24px;text-decoration:none;transition:transform .25s ease;}
  .dock-btn:hover{transform:translateY(-3px) scale(1.06);}
  .dock-wa{background:#25D366;}
  .dock-ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b 55%,#6228d7);}
  footer{padding-bottom:100px;}
  @media (max-width:820px){
    .menu-toggle{display:inline-flex;align-items:center;justify-content:center;}
    .instagram-link{display:none;}
    .main-nav{display:none;position:absolute;left:0;right:0;top:100%;margin:0;flex-direction:column;gap:2px;padding:10px 20px 16px;background:rgba(10,7,22,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.1);}
    .main-nav.open{display:flex;}
    .main-nav a{padding:12px 14px;font-size:15px;}
  }

  .ic{width:1em;height:1em;fill:currentColor;display:inline-block;vertical-align:-.125em;flex:none;}
  .dock-btn .ic{width:26px;height:26px;}
  .social-links a{width:42px;height:42px;font-size:20px;color:#fff;}
  .social-links a[title="WhatsApp"]{background:#25D366;}
  .social-links a[title="Instagram"]{background:linear-gradient(45deg,#f9ce34,#ee2a7b 55%,#6228d7);}
  .social-links a:hover{background:var(--cream);color:var(--text-dark);}
  .cake-spin canvas{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 24px 30px rgba(0,0,0,.55));}

  .hero-rotator{min-height:6.4em;display:flex;align-items:center;justify-content:center;transition:opacity .6s ease,transform .6s ease,filter .6s ease;}
  .hero-rotator.out{opacity:0;transform:translateY(10px);filter:blur(4px);}
  @media (max-width:600px){.hero-rotator{min-height:8.4em;}}

  body{touch-action:manipulation;}
  .cream-cover{position:fixed;left:0;top:0;z-index:9000;touch-action:none;opacity:0;transition:opacity .35s ease;cursor:crosshair;}
  .cream-cover.on{opacity:1;}
  .cream-hint{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:9001;pointer-events:none;padding:10px 18px;border-radius:50px;
    background:rgba(10,7,22,.78);color:#fff;font-size:14px;font-weight:500;letter-spacing:.3px;white-space:nowrap;transition:opacity .6s ease;}
</style>
</head>
